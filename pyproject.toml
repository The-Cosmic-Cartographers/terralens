[project]
name = "terralens"
version = "0.1.0"
description = "TerraLens: scan NASA Earth-science variables for a place, rank what is really changing, and show honest verdicts."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "xarray>=2024.6",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "pymannkendall>=1.4.3",
    "geopandas>=1.0",
    "shapely>=2.0",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend", "pipeline", "analysis"]
pythonpath = ["backend", "."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["frontend", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app", "pipeline", "analysis", "scripts"]
