[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terralens-earth"
version = "0.1.3"
description = "TerraLens: scan NASA Earth-science variables for a place, rank what is really changing, and show honest verdicts."
readme = "terralens/README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "The Cosmic Cartographers (TerraLens contributors)" }]
keywords = ["climate", "nasa", "earth-science", "trends", "mann-kendall"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
# The published wheel only needs the statistics stack. The web app, the pull
# pipeline and the validation tests need more, and those live in the `app`
# group below, which `uv sync` installs by default.
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "scipy>=1.13",
    "matplotlib>=3.8",
]

[project.urls]
Homepage = "https://github.com/The-Cosmic-Cartographers/terralens"
Source = "https://github.com/The-Cosmic-Cartographers/terralens"
Issues = "https://github.com/The-Cosmic-Cartographers/terralens/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]
# Repo-only dependencies: FastAPI backend, Giovanni/Harmony pull pipeline, and
# the cross-checks in the analysis tests. Not part of the wheel.
app = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "xarray>=2024.6",
    "statsmodels>=0.14",
    "pymannkendall>=1.4.3",
    "geopandas>=1.0",
    "shapely>=2.0",
    "requests>=2.32",
    "harmony-py>=0.5",
    "netcdf4>=1.6",
    "h5py>=3.10",
]

[tool.uv]
package = false
default-groups = ["dev", "app"]

[tool.pytest.ini_options]
testpaths = ["backend", "pipeline", "analysis", "terralens/tests"]
pythonpath = ["backend", "."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["frontend", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app", "pipeline", "analysis", "scripts", "terralens"]

# The wheel ships only the import package: statistics, registry, region
# metadata and the committed series all live under terralens. The repo-level
# analysis/ and pipeline/ trees stay development tools and are not installed.
[tool.setuptools]
packages = ["terralens", "terralens.variables"]

[tool.setuptools.package-data]
terralens = ["_data/processed/*/*.parquet", "_data/regions.json"]
